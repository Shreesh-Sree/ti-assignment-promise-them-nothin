worker_processes auto;
events { worker_connections 1024; }

http {
  upstream relayapi_nodes {
    server node1:8080;
    server node2:8080;
    server node3:8080;
    keepalive 64; # reuse connections to backends instead of opening one per request
  }

  server {
    listen 80;

    # Block all /internal/ routes at the ingress. These include
    # /internal/quota-state (read-only diagnostics), /internal/healthz,
    # and — critically — POST /internal/coordinator/apply-share, which
    # the peer coordinator uses to push share updates between nodes. An
    # external caller reaching apply-share could manipulate per-node
    # rate-limit allocations. Internal routes are reachable directly on
    # each node's container port for ops tooling and the harness's
    # cross-check; they must never be reachable through the public proxy.
    location /internal/ {
      return 403;
    }

    location / {
      proxy_pass http://relayapi_nodes;
      proxy_http_version 1.1;
      # Clearing Connection lets nginx pick a backend from the keepalive
      # pool per-request (round robin), rather than pinning a downstream
      # client's own keep-alive connection to one upstream node for its
      # lifetime — that pinning is exactly the traffic-concentration risk
      # DESIGN-NOTES.md Part 1 §1 flagged as unverified. This config
      # answers it: round robin is per-request here, not per-connection.
      proxy_set_header Connection "";
      # X-Customer-Id is trusted from the API gateway per platform-context.md.
      # In production this header must be set by an authenticated upstream
      # gateway, never by the external caller directly. This prototype
      # passes it through as-is; production would strip the incoming value
      # and replace it with one derived from a verified auth token.
      proxy_set_header X-Customer-Id $http_x_customer_id;
    }
  }
}

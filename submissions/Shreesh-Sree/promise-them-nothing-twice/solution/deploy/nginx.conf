worker_processes auto;
events { worker_connections 1024; }

http {
  upstream relayapi_nodes {
    server node1:8080;
    server node2:8080;
    server node3:8080;
    keepalive 64; # reuse connections to backends instead of opening one per request
  }

  server {
    listen 80;

    location / {
      proxy_pass http://relayapi_nodes;
      proxy_http_version 1.1;
      # Clearing Connection lets nginx pick a backend from the keepalive
      # pool per-request (round robin), rather than pinning a downstream
      # client's own keep-alive connection to one upstream node for its
      # lifetime — that pinning is exactly the traffic-concentration risk
      # DESIGN-NOTES.md Part 1 §1 flagged as unverified. This config
      # answers it: round robin is per-request here, not per-connection.
      proxy_set_header Connection "";
      proxy_set_header X-Customer-Id $http_x_customer_id;
    }
  }
}
